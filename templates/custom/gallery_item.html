{%set parent = get_section(path=section.ancestors[1])%}
<div class="gallery_nav">
    <a href="{{parent.permalink}}">{{trans(key="back_btn", lang=lang)}}</a>
</div>
<hr>

<h2>
    <a href="{{ section.permalink }}" style="color: inherit;">{{ section.title | safe}}</a>
</h2>
<div class="dog_description">
    {{ section.content | safe }}
</div>

{% if section.extra.gallery %}
<h3>
    {{ trans(key="gallery", lang=lang) }}
</h3>
{{<macros.gallery
    images={section.extra.gallery}
    height={500}
    colocated_path={section.colocated_path} />}}
{% endif %}
<hr>

<div class="gallery_nav">
    <a href="{{parent.permalink}}">{{trans(key="back_btn", lang=lang)}}</a>
</div>
