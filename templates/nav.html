<nav class="">
    <div class="logo">
      // logo
    </div>
    <div class="links">

      {%- for link in config.extra.nav.links %}
      {%- set s = get_section(path=link) -%}
      {%- if not s.extra.hide -%}
      <a href="{{s.permalink}}" class="item {% if current_path %}{% if current_path == "/" %} active{% endif %}{% endif %}">
        <div>{{s.title}}</div>
      </a>
      {%- endif -%}
      {% endfor %}
    </div>
</nav>
