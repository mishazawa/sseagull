<nav class="">
    <div class="logo">
      <img src="{{get_url(path='logo.png')}}">
    </div>
    <div class="links">

      {%- for link in config.extra.nav.links %}
      {%- set s = get_section(path=link) -%}
      {%- if not s.extra.hide -%}
      <a href="{{s.permalink}}" class="item">
        <div>{{s.title}}</div>
      </a>
      {%- endif -%}
      {% endfor %}
    </div>
</nav>
