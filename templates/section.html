{% extends "index.html" %}

{% block content %}
<main class="page">
    {{ section.content | safe }}

    {% for article in section.pages -%}
      {% include "feed_item.html" %}
    {%- endfor %}


    {% for subs in section.subsections -%}
    {%- set s = get_section(path=subs) -%}
    <a href="{{s.permalink}}"><h2>{{s.title}}</h2></a>
    {%- endfor %}

</main>
{% endblock content %}
